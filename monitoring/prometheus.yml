global:
  scrape_interval: 5s

scrape_configs:
  - job_name: rag
    static_configs:
      - targets: ["host.docker.internal:8000"]   # scrapes /metrics on the host API

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]   # compose service name
